<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fakebook</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/img/logos/fakebook-logo.svg" type="image/svg+xml">
  
</head>
<body>
  <div class="container">
    <header>
      <nav>
        <div class="nav-left">
          <a href="index.html" class="nav-logo">
            <img src="assets/img/logos/fakebook-logo.svg" alt="Fakebook Logo">
          </a>
          <div class="search"> 
              <img class="search-icon" src="assets/img/icons/search.svg" alt="search">
          </div>
        </div>
        <div class="nav-links main-nav">
          <button class="navlinks active" onclick="openMainTab(event, 'home')" id="defaultOpen">
          <img class="nav-icons"  src="assets/img/icons/home-outline.svg" 
              data-icon="assets/img/icons/home-outline.svg"  data-icon-active="assets/img/icons/home-fill.svg" alt="Home">
          </button>
          <button class="navlinks">
            <img class="nav-icons" src="assets/img/icons/video-outline.svg" alt="Videos">
          </button>
          <button class="navlinks">
            <img class="nav-icons" src="assets/img/icons/marketplace-outline.svg" alt="Marketplace">
          </button>
          <button class="navlinks">
            <img class="nav-icons" src="assets/img/icons/groups-outline.svg" alt="Groups">
          </button>
          <button class="navlinks">
            <img class="nav-icons game-icon" src="assets/img/icons/games-outline.svg" alt="Games">
          </button>
        </div>
        <ul class="nav-links">
          <li><a href="#"><img class="nav-icons" src="assets/img/icons/menu-black.svg" alt="Menu"></a></li>
          <li><a href="#"><img class="nav-icons" src="assets/img/icons/messages-black.svg" alt="Messages"></a></li>
          <li><a href="#"><img class="nav-icons" src="assets/img/icons/notification-black.svg" alt="Notifications"></a></li>
          <li class="profile-icon"><a href="#"><img class="nav-icons" src="assets/img/icons/cybepathways-icon-white.svg" alt="CyberPathways Icon"></a></li>
        </ul>
      </nav>
    </header>

    <div class="fakebook-page tabcontent" id="home">
      <section class="fakebook-header">
        <div class="header-img">
        </div>
        <div class="border"></div>
      </section>

      <section class="profile-section friends-list-main">
          <div class="fb-section fb-section-title">
            <h1>Friends</h1>
            <div class="btn more-dots">
                  <img src="assets/img/icons/more-fill.svg">
            </div>
          </div>
            <div class="tab">
              <button class="tablinks active" onclick="openProfileTab(event, 'posts')" id="defaultOpen">All Friends</button>
              <button class="tablinks">Birthdays</button>
              <button class="tablinks">College</button>
              <button class="tablinks">High School</button>
              <button class="tablinks">Current City</button>
              <button class="tablinks">Hometown</button>
              <button class="tablinks">Following</button>
            </div>

            <div class="fb-section friends-list-grid">
             <!-- Profile One: Jessica Brooke Taylor -->
              <a href="/profiles/jessica-b-taylor/index.html" class="friends-list-item">
                <div class="profile-photo friends-list-img profile-img">
                    <img src="/profiles/jessica-b-taylor/assets/img/posts/birthday/birthday-jess.jpg">
                </div>
                <div class="friends-list-info">
                  <p class="friend-name">Jessica Brooke Taylor</p>
                  <span class="friend-name-qty">642 friends</span>
                </div>
                <div class="btn more-dots">
                  <img src="assets/img/icons/more-fill.svg">
                </div>
              </a>

              <!-- Profile Two: Sarah Williams -->
              <a href="/profiles/sarah-williams/index.html" class="friends-list-item">
                <div class="profile-photo friends-list-img profile-img">
                    <img src="/profiles/jessica-b-taylor/assets/img/posts/birthday/birthday-jess.jpg">
                </div>
                <div class="friends-list-info">
                  <p class="friend-name">Sarah Williams</p>
                  <span class="friend-name-qty">302 friends</span>
                </div>
                <div class="btn more-dots">
                  <img src="assets/img/icons/more-fill.svg">
                </div>
              </a>
            </div>
        </div>
      </section>

    </div>
  </div>
  <script src="assets/js/main.js"></script>
</body>
</html>
